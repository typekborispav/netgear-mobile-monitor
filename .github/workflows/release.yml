# Kontrolní sestavení instalátoru (artefakt ke stažení z běhu workflow).
#
# Vydání se NEDĚLÁ tady: sestavuje, podepisuje a zveřejňuje ho autor na svém
# počítači (pwsh tools\release.ps1 -Version X.Y.Z), protože soukromý klíč
# pro podpis aktualizací na GitHub nepatří. Aplikace instaluje jen podepsané
# instalátory, takže release vytvořený odjinud by stejně odmítla.
#
# Akce jsou zafixované na konkrétní commit (ne na pohyblivý tag).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Závislosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        run: ./build.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer
          path: |
            dist/NetgearMonitor-Setup-*.exe
            dist/NetgearMonitor-Setup-*.exe.sha256
