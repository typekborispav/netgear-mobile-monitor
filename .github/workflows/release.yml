# Vydání nové verze:
#   1) zvýšit __version__ ve version.py, commit
#   2) git tag v<verze> && git push origin v<verze>
# Workflow sestaví instalátor (build.ps1) a vytvoří GitHub Release s
# NetgearMonitor-Setup-<verze>.exe + .sha256. Aplikace si ho najde přes
# api.github.com/repos/<repo>/releases/latest a nabídne aktualizaci.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Závislosti
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Kontrola verze (tag == version.py)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = (python -c "import version; print(version.__version__)").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} nesedí s version.py ($v)" }

      - name: Build
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/NetgearMonitor-Setup-*.exe
            dist/NetgearMonitor-Setup-*.exe.sha256

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -Filter "NetgearMonitor-Setup-*" | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" @files --title "Netgear Mobile Monitor ${{ github.ref_name }}" --generate-notes
